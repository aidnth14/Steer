# Render Blueprint for the Steer multiplayer server.
#
# Deploy:  push this repo to GitHub -> Render dashboard -> New -> Blueprint -> pick this repo
#          -> Apply. Render builds, injects $PORT, and server.py binds 0.0.0.0:$PORT speaking
#          WebSocket. It hands you a public URL like https://steer-server.onrender.com; the
#          clients connect to the wss:// form (wss://steer-server.onrender.com).
#
# Point the game at it with either:
#   * the STEER_SERVER_URL env var, or
#   * a `server_url.txt` next to the game containing `wss://<your-service>.onrender.com`.
#
# Free plan sleeps after ~15 min idle and cold-starts in ~30s; the game's loading screen and
# launch-time prewarm ping hide that. One web instance comfortably handles several lobbies in
# memory -- Redis is only needed to share lobbies across MULTIPLE instances (see the bottom).
services:
  - type: web
    name: steer-server
    runtime: python
    plan: free
    buildCommand: pip install "websockets>=14"
    startCommand: python server.py
    healthCheckPath: /

