<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Steer</title>
<style>
  :root{
    --bg:#0c0e16; --panel:#161a26; --panel2:#1e2434; --line:#2b3346;
    --ink:#f2f6ff; --dim:#9aa7c2; --gold:#f6cd48; --red:#ec273f; --accent:#36c5f4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#18203a 0,var(--bg) 60%);
       color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 18px 60px}
  .logo{font-weight:900;letter-spacing:.06em;font-size:46px;
        background:linear-gradient(92deg,var(--gold),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{color:var(--dim);margin:2px 0 26px;letter-spacing:.22em;font-size:12px;text-transform:uppercase}
  .card{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);
        border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .rec-label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .rec-os{font-size:24px;font-weight:800;margin:4px 0 16px}
  .rec-os span{color:var(--gold)}
  a.btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
        font-weight:800;border-radius:12px;padding:16px 18px;transition:transform .08s ease,filter .15s}
  a.btn:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(92deg,var(--red),#b5243a);color:#fff;font-size:18px}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .sub{color:var(--dim);font-size:13px;margin:10px 2px 0;text-align:center}
  .all{width:100%;max-width:560px;margin-top:26px}
  .all h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 2px 10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;
       background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .row .n{font-weight:700}.row .d{color:var(--dim);font-size:12px}
  .row a{color:var(--accent);text-decoration:none;font-weight:700;white-space:nowrap}
  .row a:hover{text-decoration:underline}
  .note{max-width:560px;color:var(--dim);font-size:12.5px;margin-top:22px;text-align:center}
  .play{margin-top:14px}
  code{background:#0a0c14;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:#cfe}
</style>
</head>
<body>
  <div class="logo">STEER</div>
  <div class="tag">Drift · Bash · Win</div>

  <div class="card">
    <div class="rec-label">Recommended for your device</div>
    <div class="rec-os" id="recOS">Detecting…</div>
    <a class="btn btn-primary" id="recBtn" href="#">Download</a>
    <a class="btn btn-ghost play" id="playBtn" href="PLAY_URL">▶ Play in browser (no download)</a>
    <div class="sub" id="recSub"></div>
  </div>

  <div class="all">
    <h3>All downloads</h3>
    <div id="allRows"></div>
  </div>

  <div class="note">
    macOS &amp; Windows builds are unsigned. First launch: on <b>macOS</b> right-click the app → <b>Open → Open</b>;
    on <b>Windows</b> click <b>More info → Run anyway</b>. See the README inside each zip.
  </div>

<script>
(function(){
  // ---- EDIT THESE TWO if your tag / itch slug differ -----------------------------------
  var BASE = "https://github.com/aidnth14/Steer/releases/download/v1.2.0/";
  var PLAY_URL = "https://aiden-shoroz.itch.io/steer";   // your itch.io browser-game page
  // --------------------------------------------------------------------------------------
  var FILES = {
    "mac-arm":  {n:"macOS — Apple Silicon (M1/M2/M3)", d:"Steer-macOS-AppleSilicon.zip", f:"Steer-macOS-AppleSilicon.zip"},
    "mac-intel":{n:"macOS — Intel",                    d:"Steer-macOS-Intel.zip",         f:"Steer-macOS-Intel.zip"},
    "windows":  {n:"Windows (x64)",                    d:"Steer-Windows-x64.zip",         f:"Steer-Windows-x64.zip"},
    "linux":    {n:"Linux (x86_64)",                   d:"Steer-Linux-x86_64.zip",        f:"Steer-Linux-x86_64.zip"}
  };
  var url = function(k){ return BASE + FILES[k].f; };

  document.getElementById("playBtn").href = PLAY_URL;

  // full list (always shown)
  var order = ["mac-arm","mac-intel","windows","linux"], html="";
  order.forEach(function(k){
    html += '<div class="row"><div><div class="n">'+FILES[k].n+'</div><div class="d">'+FILES[k].d+'</div></div>'+
            '<a href="'+url(k)+'">Download ↓</a></div>';
  });
  html += '<div class="row"><div><div class="n">Play in browser</div><div class="d">Runs on any modern browser, incl. phones</div></div>'+
          '<a href="'+PLAY_URL+'">Open ▶</a></div>';
  document.getElementById("allRows").innerHTML = html;

  // ---- OS detection --------------------------------------------------------------------
  var ua = navigator.userAgent, plat = navigator.platform || "", mtp = navigator.maxTouchPoints || 0;
  function baseOS(){
    if(/windows/i.test(ua)) return "windows";
    if(/android/i.test(ua)) return "android";
    if(/iphone|ipad|ipod/i.test(ua) || (plat==="MacIntel" && mtp>1)) return "ios"; // iPadOS masks as Mac
    if(/mac/i.test(ua) || plat==="MacIntel") return "mac";
    if(/linux|x11/i.test(ua)) return "linux";
    return "other";
  }
  async function macArch(){
    try{
      if(navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){
        var d = await navigator.userAgentData.getHighEntropyValues(["architecture"]);
        if(d.architecture==="arm") return "arm";
        if(d.architecture==="x86") return "intel";
      }
    }catch(e){}
    try{
      var gl = document.createElement("canvas").getContext("webgl") ||
               document.createElement("canvas").getContext("experimental-webgl");
      var ext = gl && gl.getExtension("WEBGL_debug_renderer_info");
      var r = (ext && (gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||"")).toLowerCase();
      if(r){
        if(r.indexOf("apple")>=0) return "arm";                       // "Apple GPU" => Apple Silicon
        if(/intel|amd|radeon|nvidia|geforce/.test(r)) return "intel"; // discrete/Intel => Intel Mac
      }
    }catch(e){}
    return "unknown";
  }
  function set(osName, key, sub){
    document.getElementById("recOS").innerHTML = "<span>"+osName+"</span>";
    var b = document.getElementById("recBtn");
    if(key){ b.href = url(key); b.textContent = "⬇  Download for "+FILES[key].n.split(" — ")[0]; b.style.display="flex"; }
    else   { b.style.display="none"; }
    document.getElementById("recSub").textContent = sub || "";
  }
  (async function(){
    var os = baseOS();
    if(os==="windows")      set("Windows","windows");
    else if(os==="linux")   set("Linux","linux");
    else if(os==="android") { set("Android", null, "The web version runs great on Android — tap Play in browser. (Native APK coming soon.)"); }
    else if(os==="ios")     { set("iPhone / iPad", null, "No app needed — tap Play in browser."); }
    else if(os==="mac"){
      var a = await macArch();
      if(a==="arm")       set("macOS · Apple Silicon","mac-arm","Detected an Apple M-series chip.");
      else if(a==="intel")set("macOS · Intel","mac-intel","Detected an Intel Mac.");
      else { set("macOS","mac-arm","Couldn't confirm the chip. If this Mac is from before ~2021, grab the Intel build instead (listed below)."); }
    }
    else set("your device", null, "Pick a build from the list below, or play in the browser.");
  })();
})();
</script>
</body>
</html>
