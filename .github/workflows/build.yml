name: build

# Build shippable Steer clients for every platform. Runs on tags (v*) and manual dispatch;
# each job uploads its artifact. PyInstaller can't cross-compile, so desktop builds fan out
# across native runners, and macOS Intel vs Apple Silicon use the x86_64 (macos-13) and
# arm64 (macos-14) runners respectively.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only_android:
        description: "Build only the Android APK (skip desktop targets)"
        type: boolean
        default: false

jobs:
  desktop:
    name: ${{ matrix.name }}
    if: ${{ inputs.only_android != true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64,    script: bash packaging/build_desktop.sh }
          - { os: macos-13,       name: macos-intel,     script: bash packaging/build_desktop.sh }
          - { os: macos-14,       name: macos-applesilicon, script: bash packaging/build_desktop.sh }
          - { os: windows-latest, name: windows-x64,     script: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: steer-${{ matrix.name }}
          path: dist/

  android:
    name: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Buildozer toolchain
        run: |
          sudo apt-get update
          # full autotools set: libffi's recipe autoreconf needs libtool's .m4 macros
          # (LT_SYS_SYMBOL_USCORE), gettext/autopoint, and automake
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk ccache \
            autoconf automake libtool libtool-bin libltdl-dev m4 pkg-config \
            autopoint gettext zlib1g-dev libncurses-dev libffi-dev libssl-dev
          python -m pip install --upgrade pip
          # Pin the whole toolchain. buildozer uses the pip-installed python-for-android; the
          # latest p4a builds Python 3.14 (whose removed longintrepr.h breaks the pygame recipe),
          # so pin p4a 2024.1.21 -> Python 3.11, which the pygame recipe compiles against.
          python -m pip install "buildozer==1.5.0" "python-for-android==2024.1.21" "cython==0.29.36"
      - name: Build debug APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: steer-android-apk
          path: bin/*.apk
