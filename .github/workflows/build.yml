name: build

# Build shippable Steer clients for every platform. Runs on tags (v*) and manual dispatch;
# each job uploads its artifact. PyInstaller can't cross-compile, so desktop builds fan out
# across native runners, and macOS Intel vs Apple Silicon use the x86_64 (macos-13) and
# arm64 (macos-14) runners respectively.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only_android:
        description: "Build only the Android APK (skip desktop targets)"
        type: boolean
        default: false

jobs:
  desktop:
    name: ${{ matrix.name }}
    if: ${{ inputs.only_android != true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64,    script: bash packaging/build_desktop.sh }
          - { os: macos-13,       name: macos-intel,     script: bash packaging/build_desktop.sh }
          - { os: macos-14,       name: macos-applesilicon, script: bash packaging/build_desktop.sh }
          - { os: windows-latest, name: windows-x64,     script: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: steer-${{ matrix.name }}
          path: dist/

  android:
    name: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build inside the maintained Kivy/Buildozer Docker image: it ships a tested combo of
      # SDK + NDK + JDK + Python + python-for-android, which sidesteps the SDK-manager / JDK /
      # libffi / Python-version breakage of hand-rolling the toolchain on a bare runner.
      - name: Build debug APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable
      - uses: actions/upload-artifact@v4
        with:
          name: steer-android-apk
          path: bin/*.apk
