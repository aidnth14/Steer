name: build

# Build shippable Steer clients for every platform. Runs on tags (v*) and manual dispatch;
# each job uploads its artifact. PyInstaller can't cross-compile, so desktop builds fan out
# across native runners, and macOS Intel vs Apple Silicon use the x86_64 (macos-13) and
# arm64 (macos-14) runners respectively.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only_android:
        description: "Build only the Android APK (skip desktop targets)"
        type: boolean
        default: false

jobs:
  desktop:
    name: ${{ matrix.name }}
    if: ${{ inputs.only_android != true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64,    script: bash packaging/build_desktop.sh }
          - { os: macos-13,       name: macos-intel,     script: bash packaging/build_desktop.sh }
          - { os: macos-14,       name: macos-applesilicon, script: bash packaging/build_desktop.sh }
          - { os: windows-latest, name: windows-x64,     script: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: steer-${{ matrix.name }}
          path: dist/

  android:
    name: android-apk
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System build deps
        run: |
          sudo apt-get update
          # libffi recipe autoreconf needs libtool's .m4 macros (LT_SYS_SYMBOL_USCORE)
          sudo apt-get install -y build-essential git zip unzip ccache \
            autoconf automake libtool libtool-bin libltdl-dev m4 pkg-config \
            autopoint gettext zlib1g-dev libncurses-dev libffi-dev libssl-dev
      - name: Android cmdline-tools + licenses
        run: |
          # modern cmdline-tools so sdkmanager works under JDK 17 (the old tools/bin one doesn't)
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sL -o t.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q t.zip && mv cmdline-tools latest && rm t.zip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Buildozer toolchain
        run: |
          python -m pip install --upgrade pip
          # p4a 2024.1.21 -> Python 3.11 (latest p4a builds 3.14, whose removed longintrepr.h
          # breaks the pygame recipe). cython pinned to the matching era.
          python -m pip install "buildozer==1.5.0" "python-for-android==2024.1.21" "cython==0.29.33"
      - name: Build debug APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: steer-android-apk
          path: bin/*.apk
